<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>已发布作业管理</title>
  <link rel="stylesheet" href="/assets/styles.css">
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js?v=2"></script>
  <style>
    /* Custom Styles for better look */
    .dashboard-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
    }
    .card {
        background: #1e2a38;
        border: 1px solid #2a3b4d;
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .btn {
        background: #00bcd4; /* Cyan */
        color: white;
        border: none;
        padding: 6px 24px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        transition: background 0.2s;
        display: inline-block;
        text-decoration: none;
    }
    .btn:hover {
        background: #00acc1;
    }
    .btn.secondary {
        background: #546e7a;
    }
    .btn.secondary:hover {
        background: #455a64;
    }
    .btn.danger {
        background: #ef5350;
    }
    .btn.danger:hover {
        background: #e53935;
    }
    .btn.warning {
        background: #ffa726;
    }
    .btn.warning:hover {
        background: #fb8c00;
    }
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.6);
        backdrop-filter: blur(2px);
    }
    .modal-content {
        background-color: #1e2a38;
        margin: 5% auto;
        padding: 25px;
        border: 1px solid #37474f;
        width: 90%;
        max-width: 1000px;
        color: #fff;
        border-radius: 8px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .close {
        color: #90a4ae;
        float: right;
        font-size: 28px;
        font-weight: bold;
        cursor: pointer;
        transition: color 0.2s;
    }
    .close:hover {
        color: #fff;
    }
    .list-item {
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 6px;
        padding: 15px;
        margin-bottom: 10px;
        transition: transform 0.2s;
    }
    .list-item:hover {
        background: rgba(255,255,255,0.05);
    }
    .col-container {
        display: flex;
        gap: 20px;
        margin-top: 20px;
    }
    .col-box {
        flex: 1;
        background: rgba(0,0,0,0.2);
        padding: 15px;
        border-radius: 6px;
        border: 1px solid #37474f;
        max-height: 500px;
        overflow-y: auto;
    }
    .col-header {
        font-weight: bold;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #37474f;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .status-badge {
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 4px;
        margin-left: 5px;
    }
    .status-graded { background: #43a047; color: white; }
    .status-returned { background: #fdd835; color: #333; }
    .status-pending { background: #29b6f6; color: white; }
    .status-missing { background: #ef5350; color: white; }
    
    .detail-section {
        background: rgba(3, 169, 244, 0.1);
        padding: 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border-left: 4px solid #03a9f4;
    }
  </style>
</head>
<body>
  <div class="dashboard-container">
    <div style="margin-bottom:20px;">
        <div style="text-align:center;">
            <h1 class="title" style="margin:0; font-size: 24px;">已发布作业管理</h1>
            <p style="color:#90a4ae; margin:5px 0 0 0;">管理您发布的所有作业，进行编辑、批改和查看详情。</p>
        </div>
        <div style="text-align:right; margin-top:10px;">
            <a href="/home/teacher.html" class="btn secondary" style="padding: 4px 12px; font-size: 12px;">返回主页</a>
        </div>
    </div>

    <div class="card">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <h3>作业列表</h3>
            <button class="btn" onclick="loadPublishedAssignments()">刷新列表</button>
        </div>
        <div id="publishedAssignmentsList">加载中...</div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal">
      <div class="modal-content" style="max-width: 600px;">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>编辑作业</h2>
        <input type="hidden" id="editId">
        <div class="form-row" style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; color:#cfd8dc;">标题</label>
            <input type="text" id="editTitle" style="width:100%; padding:10px; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;">
        </div>
        <div class="form-row" style="margin-bottom:15px;">
            <label style="display:block; margin-bottom:5px; color:#cfd8dc;">截止日期</label>
            <input type="date" id="editDueDate" style="width:100%; padding:10px; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;">
        </div>
        <div class="form-row" style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:5px; color:#cfd8dc;">内容</label>
            <textarea id="editContent" rows="5" style="width:100%; padding:10px; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;"></textarea>
        </div>
        <div style="text-align:right;">
            <button class="btn secondary" onclick="closeEditModal()" style="margin-right:10px;">取消</button>
            <button class="btn" onclick="saveEdit()">保存修改</button>
        </div>
      </div>
    </div>

    <!-- Grading Modal -->
    <div id="gradingModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="document.getElementById('gradingModal').style.display='none'">&times;</span>
            <h2 id="gradingTitle" style="margin-top:0;">作业详情与批改</h2>
            
            <div id="assignmentDetail" class="detail-section">
                <!-- Injected via JS -->
                加载中...
            </div>

            <div class="col-container">
                <!-- Submitted Column -->
                <div class="col-box">
                    <div class="col-header">
                        <span style="color:#66bb6a;">已提交学生</span>
                        <span class="status-badge status-graded" id="countSubmitted">0</span>
                    </div>
                    <div id="listSubmitted">
                        <!-- List Items -->
                    </div>
                </div>

                <!-- Unsubmitted Column -->
                <div class="col-box">
                    <div class="col-header">
                        <span style="color:#ef5350;">未提交学生</span>
                        <span class="status-badge status-missing" id="countUnsubmitted">0</span>
                    </div>
                    <div id="listUnsubmitted">
                        <!-- List Items -->
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Return Modal (Nested or separate) -->
    <div id="returnModal" class="modal" style="z-index: 1002;">
        <div class="modal-content" style="max-width: 400px; margin-top: 15%;">
            <h3>打回作业</h3>
            <p>请设置延长时间，学生需在此时间前重新提交。</p>
            <input type="hidden" id="returnSubId">
            <input type="date" id="returnDate" style="width:100%; padding:10px; margin:10px 0; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;">
            <div style="text-align:right; margin-top:10px;">
                <button class="btn secondary" onclick="document.getElementById('returnModal').style.display='none'">取消</button>
                <button class="btn warning" onclick="confirmReturn()">确认打回</button>
            </div>
        </div>
    </div>

    <!-- Submission Detail Modal -->
    <div id="submissionDetailModal" class="modal" style="z-index: 1001;">
        <div class="modal-content" style="max-width: 600px;">
            <span class="close" onclick="document.getElementById('submissionDetailModal').style.display='none'">&times;</span>
            <h3 style="margin-top:0;">学生提交详情</h3>
            
            <div style="margin-bottom:20px;">
                <div style="font-size:1.1em; font-weight:bold; margin-bottom:5px;" id="detailStudentName"></div>
                <div style="color:#888; font-size:0.9em; margin-bottom:10px;" id="detailTime"></div>
                <div style="background:#10161d; padding:15px; border-radius:4px; color:#ccc; line-height:1.6; white-space:pre-wrap;" id="detailContent"></div>
            </div>

            <div style="margin-top:20px; padding-top:20px; border-top:1px solid #37474f;">
                <h4 style="margin-bottom:15px;">批改操作</h4>
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="width:100px;">
                        <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">分数</label>
                        <input type="number" id="detailScore" placeholder="0-100" style="width:100%; padding:8px; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;">
                    </div>
                    <div style="flex:1;">
                        <label style="font-size:12px; color:#aaa; display:block; margin-bottom:4px;">评语</label>
                        <input type="text" id="detailFeedback" placeholder="请输入评语" style="width:100%; padding:8px; background:#263238; color:#fff; border:1px solid #455a64; border-radius:4px;">
                    </div>
                </div>
                <div style="text-align:right;">
                    <input type="hidden" id="detailSubId">
                    <button class="btn warning" onclick="openReturnFromDetail()" style="margin-right:10px;">打回重做</button>
                    <button class="btn" onclick="submitGradeFromDetail()">提交评分</button>
                </div>
            </div>
        </div>
    </div>

  </div>

<script>
    // Ensure Auth
    document.addEventListener('DOMContentLoaded', () => {
        const user = Auth.getUser();
        if (!user || (user.role !== 'TEACHER' && user.role !== 'SCHOOL_ADMIN' && user.role !== 'SYSTEM_ADMIN')) {
            window.location.href = '/login.html';
            return;
        }
        loadPublishedAssignments();
    });

    async function loadPublishedAssignments() {
        const listEl = document.getElementById('publishedAssignmentsList');
        listEl.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">加载数据中...</div>';
        try {
            const list = await DashboardAPI.apiGet('/api/assignments/published');
            if (!Array.isArray(list) || list.length === 0) {
                listEl.innerHTML = '<div style="padding:40px; text-align:center; color:#888; font-size:16px;">暂无发布记录</div>';
                return;
            }
            listEl.innerHTML = list.map(a => `
                <div class="list-item">
                    <div style="display:flex; justify-content:space-between; align-items:start;">
                        <div style="flex:1; padding-right:20px;">
                            <div style="font-size:1.2em; font-weight:bold; margin-bottom:8px; color:#e0f7fa;">${a.title}</div>
                            <div style="font-size:0.9em; color:#90a4ae; margin-bottom:10px;">
                                <span style="margin-right:15px;">📅 截止: ${a.dueDate || '无'}</span>
                                <span style="margin-right:15px;">🏫 班级ID: ${a.classId}</span>
                                <span>👤 发布人: ${a.teacher ? a.teacher.username : '未知'}</span>
                            </div>
                            <div style="color:#cfd8dc; white-space:pre-wrap; line-height:1.5; font-size:0.95em;">${a.content.length > 100 ? a.content.substring(0,100) + '...' : a.content}</div>
                        </div>
                        <div style="display:flex; flex-direction:row; gap:10px; align-items:center;">
                            <button class="btn" onclick="openGrading(${a.id})">批改/查看</button>
                            <button class="btn secondary" onclick="openEdit(${a.id}, '${a.title}', '${a.dueDate||''}', \`${a.content.replace(/`/g, '\\`')}\`)">编辑</button>
                            <button class="btn danger" onclick="deleteAssignment(${a.id})">删除</button>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch(err) {
            console.error(err);
            listEl.innerHTML = '<div style="color:#ef5350; padding:20px; text-align:center;">加载失败: ' + (err.status || 'Unknown') + '</div>';
        }
    }

    async function deleteAssignment(id) {
        if(!confirm('确定要删除该作业吗？\n删除后，学生端、家长端将同步不可见，且所有已提交的作业记录也会被清除。')) return;
        try {
            await DashboardAPI.apiDelete('/api/assignments/' + id);
            alert('删除成功');
            loadPublishedAssignments();
        } catch(err) {
            alert('删除失败: ' + (err.data?.error || err.message || '未知错误'));
        }
    }

    // Edit Logic
    function openEdit(id, title, dueDate, content) {
        document.getElementById('editId').value = id;
        document.getElementById('editTitle').value = title;
        document.getElementById('editDueDate').value = dueDate;
        document.getElementById('editContent').value = content;
        document.getElementById('editModal').style.display = 'block';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveEdit() {
        const id = document.getElementById('editId').value;
        const title = document.getElementById('editTitle').value;
        const dueDate = document.getElementById('editDueDate').value;
        const content = document.getElementById('editContent').value;

        if(!title || !content) { alert('标题和内容不能为空'); return; }

        try {
            await DashboardAPI.apiPut('/api/assignments/' + id, { title, content, dueDate });
            alert('保存成功');
            closeEditModal();
            loadPublishedAssignments();
        } catch(err) {
            alert('保存失败: ' + (err.data?.error || err.message));
        }
    }

    // Grading Logic
    let currentGradingStudents = []; // Store for detail view
    let currentAssignmentId = null;

    async function openGrading(id) {
        currentAssignmentId = id;
        const modal = document.getElementById('gradingModal');
        const detailEl = document.getElementById('assignmentDetail');
        const listSubmitted = document.getElementById('listSubmitted');
        const listUnsubmitted = document.getElementById('listUnsubmitted');
        
        modal.style.display = 'block';
        detailEl.innerHTML = '加载中...';
        listSubmitted.innerHTML = '加载中...';
        listUnsubmitted.innerHTML = '加载中...';

        try {
            // Updated endpoint returns composite data
            const data = await DashboardAPI.apiGet(`/api/assignments/${id}/submissions`);
            
            // 1. Render Detail
            const a = data.assignment;
            detailEl.innerHTML = `
                <div style="font-size:1.2em; font-weight:bold; margin-bottom:10px;">${a.title}</div>
                <div style="margin-bottom:10px; color:#e0e0e0; white-space:pre-wrap;">${a.content}</div>
                <div style="font-size:0.9em; color:#90a4ae;">
                    <span>截止日期: ${a.dueDate || '无'}</span> | 
                    <span>班级ID: ${a.classId}</span>
                </div>
            `;
            
            // 2. Process Students
            currentGradingStudents = data.students || [];
            const submitted = currentGradingStudents.filter(s => s.hasSubmitted);
            const unsubmitted = currentGradingStudents.filter(s => !s.hasSubmitted);
            
            document.getElementById('countSubmitted').textContent = submitted.length;
            document.getElementById('countUnsubmitted').textContent = unsubmitted.length;
            
            // Render Submitted
            if (submitted.length === 0) {
                listSubmitted.innerHTML = '<div style="color:#777; padding:10px;">暂无学生提交</div>';
            } else {
                listSubmitted.innerHTML = submitted.map(s => {
                    const sub = s.submission;
                    const statusClass = sub.status === 'GRADED' ? 'status-graded' : (sub.status === 'RETURNED' ? 'status-returned' : 'status-pending');
                    const statusText = sub.status === 'GRADED' ? '已评分' : (sub.status === 'RETURNED' ? '已打回' : '待批改');
                    
                    return `
                    <div style="background:rgba(255,255,255,0.05); padding:10px; margin-bottom:10px; border-radius:4px; display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <div style="font-weight:bold;">${s.studentName} <span style="font-weight:normal; font-size:0.8em; color:#aaa;">(${s.studentNo || 'No ID'})</span></div>
                            <div style="font-size:0.8em; color:#888; margin-top:4px;">${new Date(sub.submittedAt).toLocaleString()}</div>
                        </div>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <button class="btn" style="padding:4px 10px; font-size:12px;" onclick="openSubmissionDetail(${sub.id})">查看</button>
                        </div>
                    </div>
                `}).join('');
            }
            
            // Render Unsubmitted
            if (unsubmitted.length === 0) {
                listUnsubmitted.innerHTML = '<div style="color:#777; padding:10px;">所有学生都已提交</div>';
            } else {
                listUnsubmitted.innerHTML = unsubmitted.map(s => `
                    <div style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.05);">
                        <div style="font-weight:bold;">${s.studentName}</div>
                        <div style="font-size:0.8em; color:#888;">学号: ${s.studentNo || '-'}</div>
                    </div>
                `).join('');
            }

        } catch(err) {
            console.error(err);
            detailEl.innerHTML = '<div style="color:#f55;">加载失败: ' + (err.message || 'Unknown') + '</div>';
        }
    }

    // Submission Detail Logic
    function openSubmissionDetail(subId) {
        const student = currentGradingStudents.find(s => s.hasSubmitted && s.submission.id === subId);
        if (!student) return;
        
        const sub = student.submission;
        
        document.getElementById('detailStudentName').textContent = `${student.studentName} (${student.studentNo||''})`;
        document.getElementById('detailTime').textContent = `提交时间: ${new Date(sub.submittedAt).toLocaleString()}`;
        document.getElementById('detailContent').textContent = sub.content;
        
        document.getElementById('detailScore').value = sub.score || '';
        document.getElementById('detailFeedback').value = sub.feedback || '';
        document.getElementById('detailSubId').value = sub.id;
        
        document.getElementById('submissionDetailModal').style.display = 'block';
    }

    async function submitGradeFromDetail() {
        const submissionId = document.getElementById('detailSubId').value;
        const score = document.getElementById('detailScore').value;
        const feedback = document.getElementById('detailFeedback').value;
        
        if (score === '') { alert('请输入分数'); return; }
        
        try {
            await DashboardAPI.apiPost(`/api/submissions/${submissionId}/grade`, { score: Number(score), feedback });
            alert('打分成功');
            document.getElementById('submissionDetailModal').style.display = 'none';
            if(currentAssignmentId) openGrading(currentAssignmentId);
        } catch(err) {
            alert('打分失败: ' + (err.data?.error || err.message));
        }
    }

    function openReturnFromDetail() {
        const subId = document.getElementById('detailSubId').value;
        openReturn(subId);
    }

    // Return Logic
    window.openReturn = function(subId) {
        document.getElementById('returnSubId').value = subId;
        // Default date: tomorrow
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        document.getElementById('returnDate').valueAsDate = tomorrow;
        
        document.getElementById('returnModal').style.display = 'block';
    }

    window.confirmReturn = async function() {
        const subId = document.getElementById('returnSubId').value;
        const date = document.getElementById('returnDate').value;
        if (!date) { alert('请选择延长截止日期'); return; }
        
        try {
            await DashboardAPI.apiPost(`/api/submissions/${subId}/return`, { extendedDueDate: date });
            alert('作业已打回');
            document.getElementById('returnModal').style.display = 'none';
            document.getElementById('submissionDetailModal').style.display = 'none';
            if(currentAssignmentId) openGrading(currentAssignmentId);
        } catch(err) {
            alert('打回失败: ' + (err.data?.error || err.message));
        }
    }

    // Close modal when clicking outside
    window.onclick = function(event) {
        const modals = ['editModal', 'gradingModal', 'returnModal', 'submissionDetailModal'];
        modals.forEach(id => {
            const m = document.getElementById(id);
            if (event.target == m) m.style.display = "none";
        });
    }
</script>
</body>
</html>
