spring:
  datasource:
    url: jdbc:mysql://<host>:<port>/<database>?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: <user>
    password: <password>
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
server:
  port: 8081